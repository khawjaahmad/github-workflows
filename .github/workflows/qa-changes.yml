name: QA Changes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
      - LICENSE
  merge_group:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to QA
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: qa-changes-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check that the provider is configured
        id: preflight
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || vars.LLM_MODEL }}
        run: |
          missing=""
          if [ -z "$LLM_API_KEY" ]; then missing="$missing LLM_API_KEY"; fi
          if [ -z "$LLM_MODEL" ]; then missing="$missing LLM_MODEL"; fi
          if [ -n "$missing" ]; then
            echo "Skipping QA — not set:$missing. Add them under Settings → Secrets and variables → Actions." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the pull request
        id: pr
        if: steps.preflight.outputs.ready == 'true'
        env:
          EVENT_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REF: ${{ github.ref }}
        run: |
          number="$EVENT_NUMBER"
          if [ -z "$number" ]; then
            number=$(echo "$REF" | sed -n 's#.*/pr-\([0-9]*\)[-/].*#\1#p')
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Check out the pull request # zizmor: ignore[artipacked]
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || (inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number)) || github.sha }}
          fetch-depth: 0

      - name: QA the changes
        if: steps.preflight.outputs.ready == 'true'
        uses: ./
        with:
          api_key: ${{ secrets.LLM_API_KEY }}
          model: ${{ secrets.LLM_MODEL || vars.LLM_MODEL }}
          provider: zai
          effort: max
          pr_number: ${{ steps.pr.outputs.number }}
