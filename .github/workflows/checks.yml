name: Checks

# This repository exercising its own smoke, build, diff-scope and pr-gate actions.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: smoke
        uses: ./smoke
        with:
          start_command: python3 -m http.server 8765
          ready_url: http://127.0.0.1:8765/
          routes: |
            /README.md
            /does-not-exist=404
          commands: |
            python3 --version
            python3 -m unittest discover -s tests
      - name: The verdict is PASS
        env:
          STATUS: ${{ steps.smoke.outputs.status }}
        run: test "$STATUS" = PASS

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: build
        uses: ./build
      - name: Nothing to build here, so the verdict is SKIPPED
        env:
          STATUS: ${{ steps.build.outputs.status }}
        run: test "$STATUS" = SKIPPED
      - id: custom
        uses: ./build
        with:
          build_command: python -m compileall -q qa_agent qa_checks
      - name: A custom command builds and passes
        env:
          STATUS: ${{ steps.custom.outputs.status }}
          DETECTED: ${{ steps.custom.outputs.detected }}
        run: test "$STATUS" = PASS && test "$DETECTED" = custom

  diff-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out with history # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 -m pip install --quiet coverage && python3 -m coverage run -m unittest discover -s tests && python3 -m coverage xml
      - id: scope
        uses: ./diff-scope
        with:
          filters: |
            python:
              - 'qa_agent/**'
              - 'qa_checks/**'
            workflows:
              - '.github/**'
              - '*/action.yml'
          coverage_file: coverage.xml
      - env:
          CHANGES: ${{ steps.scope.outputs.changes }}
          PATCH: ${{ steps.scope.outputs.patch_coverage }}
          STATUS: ${{ steps.scope.outputs.status }}
        run: echo "changes=$CHANGES patch_coverage=$PATCH status=$STATUS"

  pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out with history # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./pr-gate
        with:
          max_lines_changed: 5000
          require_tests_for: qa_agent/*.py,qa_checks/*.py
          fail_on: none

  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out with history # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: api
        uses: ./api-contract
        with:
          spec_path: tests/fixtures/openapi.yaml
          base_ref: ${{ github.base_ref || github.event.merge_group.base_ref }}
      - name: The fixture spec lints clean and is not a breaking change
        env:
          STATUS: ${{ steps.api.outputs.status }}
          KIND: ${{ steps.api.outputs.kind }}
        run: test "$STATUS" = PASS && test "$KIND" = openapi
      - id: none
        uses: ./api-contract
      - name: No spec at the root, so the verdict is SKIPPED
        env:
          STATUS: ${{ steps.none.outputs.status }}
        run: test "$STATUS" = SKIPPED

  web-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: web
        uses: ./web-check
        with:
          start_command: python3 -m http.server 8766 --bind 127.0.0.1 -d tests/fixtures/site
          port: 8766
          lighthouse_routes: 1
      - name: The fixture site passes every angle
        env:
          STATUS: ${{ steps.web.outputs.status }}
        run: test "$STATUS" = PASS

  test-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: report
        uses: ./test-report
        with:
          junit_glob: tests/fixtures/junit.xml
          name: Fixture results
      - name: The fixture results publish as a passing check
        env:
          STATUS: ${{ steps.report.outputs.status }}
        run: test "$STATUS" = PASS

  migration-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out with history # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: lint
        uses: ./migration-lint
        with:
          sql_globs: tests/fixtures/migrations/*.sql
          scope: all
      - name: The fixture migration is safe
        env:
          STATUS: ${{ steps.lint.outputs.status }}
          FILES: ${{ steps.lint.outputs.files }}
        run: test "$STATUS" = PASS && test "$FILES" = 1

  release-verify:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/release-verify.yml
    with:
      sbom: true

  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the fixture app from the test-fixtures release, pinned by checksum
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o app-release.apk \
            https://github.com/khawjaahmad/github-workflows/releases/download/test-fixtures/app-release.apk
          echo "9ede74b5da80f62ed6085db9cc92f42c5d860e3dc9b05ef3f4390db6b8748df4  app-release.apk" | sha256sum -c -
      - id: mobile
        uses: ./mobile-smoke
        with:
          app_path: app-release.apk
          flows_dir: tests/fixtures/maestro
          monkey_events: 500
      - name: The fixture app installs, launches, survives the monkey and runs the flow
        env:
          STATUS: ${{ steps.mobile.outputs.status }}
          PACKAGE: ${{ steps.mobile.outputs.package }}
        run: test "$STATUS" = PASS && test "$PACKAGE" = com.ahmad.trolling
