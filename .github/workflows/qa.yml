name: QA Changes (reusable)

on:
  workflow_call:
    inputs:
      model:
        description: Model id. Left empty, QA is skipped rather than failing the check.
        required: false
        type: string
        default: ""
      provider:
        description: "zai, openai, gemini or custom."
        required: false
        type: string
        default: zai
      base_url:
        description: OpenAI-compatible base URL; required when provider is custom.
        required: false
        type: string
        default: ""
      effort:
        description: Reasoning effort, passed to the provider verbatim.
        required: false
        type: string
        default: ""
      fail_on:
        description: Verdicts that fail the check, or `none` to always stay green.
        required: false
        type: string
        default: FAIL
      context_tokens:
        description: The model's context window, so the agent compacts before reaching it.
        required: false
        type: number
        default: 0
      setup_command:
        description: Command the agent runs before it starts testing.
        required: false
        type: string
        default: ""
      max_turns:
        description: Model turns before the agent is told to wrap up.
        required: false
        type: number
        default: 40
      time_budget:
        description: Wall-clock seconds before the agent is told to wrap up.
        required: false
        type: number
        default: 1500
      runs_on:
        description: Runner label. The default image carries the browsers and databases.
        required: false
        type: string
        default: ubuntu-latest
      timeout_minutes:
        description: Job timeout. Keep it comfortably above time_budget.
        required: false
        type: number
        default: 30
    secrets:
      llm_api_key:
        description: "Provider API key. Omit it when using `secrets: inherit`."
        required: false
    outputs:
      status:
        description: The QA verdict — PASS, FAIL or PARTIAL.
        value: ${{ jobs.qa.outputs.status }}

jobs:
  qa:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      status: ${{ steps.qa.outputs.status }}
    steps:
      - name: Check that the provider is configured
        id: preflight
        env:
          LLM_API_KEY: ${{ secrets.llm_api_key || secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ inputs.model }}
        run: |
          missing=""
          if [ -z "$LLM_API_KEY" ]; then missing="$missing LLM_API_KEY"; fi
          if [ -z "$LLM_MODEL" ]; then missing="$missing model"; fi
          if [ -n "$missing" ]; then
            echo "Skipping QA — not set:$missing. See https://github.com/khawjaahmad/github-workflows/blob/main/USAGE.md" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the pull request
        id: pr
        if: steps.preflight.outputs.ready == 'true'
        env:
          EVENT_NUMBER: ${{ github.event.pull_request.number }}
          REF: ${{ github.ref }}
        run: |
          # On merge_group there is no pull_request payload; the queue branch carries the number.
          number="$EVENT_NUMBER"
          if [ -z "$number" ]; then
            number=$(echo "$REF" | sed -n 's#.*/pr-\([0-9]*\)[-/].*#\1#p')
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Check out the pull request # zizmor: ignore[artipacked]
        if: steps.preflight.outputs.ready == 'true'
        # The agent fetches the base commit for before/after comparisons, so it keeps credentials.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: QA the changes
        id: qa
        if: steps.preflight.outputs.ready == 'true'
        uses: khawjaahmad/github-workflows@v1.2.0 # zizmor: ignore[unpinned-uses]
        with:
          api_key: ${{ secrets.llm_api_key || secrets.LLM_API_KEY }}
          model: ${{ inputs.model }}
          provider: ${{ inputs.provider }}
          base_url: ${{ inputs.base_url }}
          effort: ${{ inputs.effort }}
          fail_on: ${{ inputs.fail_on }}
          context_tokens: ${{ inputs.context_tokens }}
          setup_command: ${{ inputs.setup_command }}
          max_turns: ${{ inputs.max_turns }}
          time_budget: ${{ inputs.time_budget }}
          pr_number: ${{ steps.pr.outputs.number }}
