name: Release Verify (reusable)

on:
  workflow_call:
    inputs:
      pr_title:
        description: Require a Conventional Commits pull request title (on pull_request events).
        required: false
        type: boolean
        default: true
      title_types:
        description: Allowed title types, one per line. Empty means the Conventional Commits defaults.
        required: false
        type: string
        default: ""
      sbom:
        description: Generate an SPDX SBOM of the checkout and attach it as a workflow artifact.
        required: false
        type: boolean
        default: false
      attest_paths:
        description: Newline-separated paths of built artifacts to attest provenance for. Empty skips.
        required: false
        type: string
        default: ""
      artifact_name:
        description: Workflow artifact holding the files in attest_paths, downloaded into `release-artifacts/`.
        required: false
        type: string
        default: ""
      runs_on:
        description: Runner label.
        required: false
        type: string
        default: ubuntu-latest

jobs:
  title:
    if: inputs.pr_title && github.event_name == 'pull_request'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    steps:
      - name: The pull request title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: ${{ inputs.title_types }}

  sbom:
    if: inputs.sbom
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom-${{ github.sha }}.spdx.json
          upload-artifact: true

  attest:
    # Needs id-token: write and attestations: write, which the caller must grant; a called
    # workflow can only reduce the caller's permissions, never request more.
    if: inputs.attest_paths != ''
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 10
    steps:
      - name: Download the built artifacts
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: release-artifacts
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ inputs.attest_paths }}
