name: Lint workflows

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            | tar -xz -C /tmp actionlint
          /tmp/actionlint -color
      - name: zizmor
        run: |
          python3 -m pip install --quiet zizmor==1.30.1
          zizmor --min-severity medium .github/ smoke/action.yml build/action.yml pr-gate/action.yml diff-scope/action.yml action.yml
