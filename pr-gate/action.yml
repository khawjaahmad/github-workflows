name: PR Gate
description: Deterministic hygiene checks on a pull request — size, paths, TODOs, secrets, workflow lint, dependency review.
author: khawjaahmad

inputs:
  github_token:
    description: Token used to read the pull request and add labels.
    required: false
    default: ${{ github.token }}
  pr_number:
    description: Pull request number. Defaults to the PR from the triggering event.
    required: false
    default: ""
  github_api_url:
    description: GitHub REST API root. Defaults to the current host.
    required: false
    default: ${{ github.api_url }}
  max_lines_changed:
    description: Fail when more than this many lines are added plus deleted. 0 disables.
    required: false
    default: "1500"
  ignore_globs:
    description: Comma- or newline-separated globs excluded from the line count.
    required: false
    default: ""
  allowed_paths:
    description: Globs every changed file must match. Empty means no restriction.
    required: false
    default: ""
  forbidden_paths:
    description: Globs no changed file may match.
    required: false
    default: ""
  no_new_todos:
    description: Fail when the diff adds a TODO or FIXME.
    required: false
    default: "true"
  require_tests_for:
    description: Globs of source files whose change must be accompanied by a test change.
    required: false
    default: ""
  test_globs:
    description: Globs that identify test files.
    required: false
    default: ""
  secrets:
    description: Scan the PR's commits for secrets with gitleaks. Needs a checkout with fetch-depth 0.
    required: false
    default: "true"
  workflow_lint:
    description: Run actionlint and zizmor when files under .github/ changed. Needs a checkout.
    required: false
    default: "true"
  dependency_review:
    description: Run dependency review when the dependency graph is enabled.
    required: false
    default: "false"
  label_agent_prs:
    description: Add a label when the PR author or a commit trailer is a coding agent.
    required: false
    default: "true"
  agent_logins:
    description: Comma-separated bot logins treated as coding agents.
    required: false
    default: ""
  agent_label:
    description: The label to add.
    required: false
    default: ai-generated
  fail_on:
    description: Verdicts that fail the check — `FAIL`, or `none` to stay advisory.
    required: false
    default: FAIL
  python_version:
    description: Python version used to run the checks.
    required: false
    default: "3.11"

outputs:
  status:
    description: PASS or FAIL.
    value: ${{ steps.status.outputs.status }}
  is_agent_pr:
    description: true when the PR looks agent-authored.
    value: ${{ steps.gate.outputs.is_agent_pr }}

runs:
  using: composite
  steps:
    - name: Set up Python for the gate
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python_version }}

    - name: Metadata checks
      id: gate
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PYTHONPATH: ${{ github.action_path }}/..
        QA_GITHUB_TOKEN: ${{ inputs.github_token }}
        QA_REPO: ${{ github.repository }}
        QA_GITHUB_API_URL: ${{ inputs.github_api_url }}
        QA_PR_NUMBER: ${{ inputs.pr_number != '' && inputs.pr_number || github.event.pull_request.number }}
        QA_GATE_MAX_LINES: ${{ inputs.max_lines_changed }}
        QA_GATE_IGNORE_GLOBS: ${{ inputs.ignore_globs }}
        QA_GATE_ALLOWED_PATHS: ${{ inputs.allowed_paths }}
        QA_GATE_FORBIDDEN_PATHS: ${{ inputs.forbidden_paths }}
        QA_GATE_NO_NEW_TODOS: ${{ inputs.no_new_todos }}
        QA_GATE_REQUIRE_TESTS_FOR: ${{ inputs.require_tests_for }}
        QA_GATE_TEST_GLOBS: ${{ inputs.test_globs }}
        QA_GATE_LABEL_AGENT_PRS: ${{ inputs.label_agent_prs }}
        QA_GATE_AGENT_LOGINS: ${{ inputs.agent_logins }}
        QA_GATE_AGENT_LABEL: ${{ inputs.agent_label }}
        QA_GATE_DEPENDENCY_REVIEW: ${{ inputs.dependency_review }}
      run: python -m qa_checks.pr_gate

    - name: Secrets
      id: secrets
      if: inputs.secrets == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      continue-on-error: true
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
      run: |
        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "Skipping secrets: no git checkout" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
        fi
        curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          | tar -xz -C /tmp gitleaks
        git cat-file -e "$BASE" 2>/dev/null || git fetch --no-tags origin "$BASE"
        /tmp/gitleaks git --no-banner --redact --log-opts="$BASE..$HEAD" .

    - name: Workflow lint
      id: lint
      if: inputs.workflow_lint == 'true' && steps.gate.outputs.workflows_changed == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      continue-on-error: true
      run: |
        curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
          | tar -xz -C /tmp actionlint
        python -m pip install --quiet zizmor==1.30.1
        /tmp/actionlint -color
        zizmor --min-severity medium .github/

    - name: Dependency review
      id: depreview
      if: inputs.dependency_review == 'true' && steps.gate.outputs.dependency_graph == 'true'
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      continue-on-error: true

    - name: Status
      id: status
      if: always()
      shell: bash
      env:
        META: ${{ steps.gate.outputs.status }}
        SECRETS: ${{ steps.secrets.outcome }}
        LINT: ${{ steps.lint.outcome }}
        DEPS: ${{ steps.depreview.outcome }}
        FAIL_ON: ${{ inputs.fail_on }}
      run: |
        status=PASS
        [ "$META" = PASS ] || status=FAIL
        for outcome in "$SECRETS" "$LINT" "$DEPS"; do
          [ "$outcome" = failure ] && status=FAIL
        done
        echo "status=$status" >> "$GITHUB_OUTPUT"
        echo "PR gate: $status (metadata=$META secrets=$SECRETS lint=$LINT dependency-review=$DEPS)"
        case ",$(echo "$FAIL_ON" | tr '[:upper:]' '[:lower:]')," in
          *,fail,*) [ "$status" = FAIL ] && exit 1 ;;
        esac
        exit 0
