name: Build
description: Detect how the repository builds and prove the pull request still builds.
author: khawjaahmad

inputs:
  build_command:
    description: Build command to run. When set, detection is skipped.
    required: false
    default: ""
  working_directory:
    description: Directory, relative to the workspace, to detect and build in.
    required: false
    default: "."
  timeout_minutes:
    description: Minutes allowed for the build command.
    required: false
    default: "20"
  fail_on:
    description: Verdicts that fail the check — `FAIL`, or `none` to stay advisory.
    required: false
    default: FAIL
  python_version:
    description: Python version used to run the probe.
    required: false
    default: "3.11"

outputs:
  status:
    description: PASS, FAIL or SKIPPED.
    value: ${{ steps.status.outputs.status }}
  detected:
    description: The build system detected (make, node, python, go, rust, maven, gradle, dotnet, ruby, elixir, bazel, docker, custom) or empty.
    value: ${{ steps.probe.outputs.detected }}
  build_command:
    description: The command that ran.
    value: ${{ steps.probe.outputs.build_command }}

runs:
  using: composite
  steps:
    - name: Set up Python for the build probe
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python_version }}

    - name: Detect the build system
      id: probe
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PYTHONPATH: ${{ github.action_path }}/..
        QA_WORKSPACE: ${{ github.workspace }}
        QA_BUILD_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        QA_BUILD_COMMAND: ${{ inputs.build_command }}
      run: python -m qa_checks.build_probe

    - name: Install toolchains from mise or asdf files
      if: steps.probe.outputs.detected != '' && hashFiles('mise.toml', '.mise.toml', '.tool-versions') != ''
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

    - name: Set up Node from its version file
      if: steps.probe.outputs.toolchain == 'node' && hashFiles('.nvmrc', '.node-version') != ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ hashFiles('.nvmrc') != '' && '.nvmrc' || '.node-version' }}

    - name: Set up Python from its version file
      if: steps.probe.outputs.toolchain == 'python' && hashFiles('.python-version') != ''
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version-file: .python-version

    - name: Build
      id: build
      if: steps.probe.outputs.detected != ''
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.working_directory }}
      continue-on-error: true
      env:
        BUILD_COMMAND: ${{ steps.probe.outputs.build_command }}
        TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
      run: |
        echo "::group::$BUILD_COMMAND"
        timeout "${TIMEOUT_MINUTES}m" bash -eo pipefail -c "$BUILD_COMMAND"
        echo "::endgroup::"

    - name: Status
      id: status
      if: always()
      shell: bash
      env:
        DETECTED: ${{ steps.probe.outputs.detected }}
        BUILD_COMMAND: ${{ steps.probe.outputs.build_command }}
        OUTCOME: ${{ steps.build.outcome }}
        FAIL_ON: ${{ inputs.fail_on }}
      run: |
        if [ -z "$DETECTED" ]; then status=SKIPPED
        elif [ "$OUTCOME" = success ]; then status=PASS
        else status=FAIL; fi
        echo "status=$status" >> "$GITHUB_OUTPUT"
        if [ -n "$DETECTED" ]; then
          echo "### Build: $status" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Detected \`$DETECTED\`, ran \`$BUILD_COMMAND\`." >> "$GITHUB_STEP_SUMMARY"
        fi
        case ",$(echo "$FAIL_ON" | tr '[:upper:]' '[:lower:]')," in
          *,fail,*) [ "$status" = FAIL ] && exit 1 ;;
        esac
        exit 0
