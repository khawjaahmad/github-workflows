name: QA Changes
description: Validate a pull request by running the software and post a QA report as a comment.
author: khawjaahmad

inputs:
  api_key:
    description: API key for the LLM provider (store it as the LLM_API_KEY secret).
    required: true
  provider:
    description: OpenAI-compatible endpoint — zai, openai, gemini or custom. Selects the base URL.
    required: false
    default: zai
  model:
    description: Model id. No default is shipped — supply it from a secret or variable.
    required: true
  base_url:
    description: OpenAI-compatible base URL. Required when provider is `custom`.
    required: false
    default: ""
  github_token:
    description: Token used to read the pull request and post the QA report.
    required: false
    default: ${{ github.token }}
  pr_number:
    description: Pull request number. Defaults to the PR from the triggering event.
    required: false
    default: ""
  github_api_url:
    description: GitHub REST API root. Defaults to the current host, so Enterprise Server works.
    required: false
    default: ${{ github.api_url }}
  effort:
    description: Reasoning effort, sent as `reasoning_effort` verbatim. Empty uses the model default.
    required: false
    default: ""
  setup_command:
    description: Optional command the agent runs before it starts testing.
    required: false
    default: ""
  max_turns:
    description: Model turns before the agent is told to wrap up and report.
    required: false
    default: "40"
  time_budget:
    description: Wall-clock seconds before the agent wraps up. Keep under `timeout-minutes`. 0 disables.
    required: false
    default: "1500"
  command_timeout:
    description: Default timeout in seconds for each command the agent runs.
    required: false
    default: "300"
  request_timeout:
    description: Timeout in seconds for each request to the model endpoint.
    required: false
    default: "600"
  context_tokens:
    description: The model's context window in tokens. 0 compacts only on a reported overflow.
    required: false
    default: "0"
  post_comment:
    description: Post the report as a PR comment. Set to false to only log it.
    required: false
    default: "true"
  fail_on:
    description: Verdicts that fail the check — `FAIL`, `FAIL,PARTIAL`, or `none`.
    required: false
    default: FAIL
  upload_artifacts:
    description: Upload whatever the agent saved as a workflow artifact.
    required: false
    default: "true"
  artifact_retention_days:
    description: How long to keep the uploaded artifacts.
    required: false
    default: "14"
  python_version:
    description: Python version used to run the agent.
    required: false
    default: "3.11"

outputs:
  status:
    description: The QA verdict — PASS, FAIL or PARTIAL.
    value: ${{ steps.qa.outputs.status }}

runs:
  using: composite
  steps:
    - name: Set up Python for the QA agent
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python_version }}

    - name: Run QA agent
      id: qa
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PYTHONPATH: ${{ github.action_path }}
        QA_API_KEY: ${{ inputs.api_key }}
        QA_PROVIDER: ${{ inputs.provider }}
        QA_MODEL: ${{ inputs.model }}
        QA_BASE_URL: ${{ inputs.base_url }}
        QA_GITHUB_TOKEN: ${{ inputs.github_token }}
        QA_REPO: ${{ github.repository }}
        QA_GITHUB_API_URL: ${{ inputs.github_api_url }}
        QA_PR_NUMBER: ${{ inputs.pr_number != '' && inputs.pr_number || github.event.pull_request.number }}
        QA_WORKSPACE: ${{ github.workspace }}
        QA_EFFORT: ${{ inputs.effort }}
        QA_SETUP_COMMAND: ${{ inputs.setup_command }}
        QA_MAX_TURNS: ${{ inputs.max_turns }}
        QA_TIME_BUDGET: ${{ inputs.time_budget }}
        QA_COMMAND_TIMEOUT: ${{ inputs.command_timeout }}
        QA_REQUEST_TIMEOUT: ${{ inputs.request_timeout }}
        QA_CONTEXT_TOKENS: ${{ inputs.context_tokens }}
        QA_POST_COMMENT: ${{ inputs.post_comment }}
        QA_FAIL_ON: ${{ inputs.fail_on }}
        QA_ARTIFACTS_DIR: ${{ runner.temp }}/qa-artifacts
        QA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: python -m qa_agent

    - name: Upload QA artifacts
      if: always() && inputs.upload_artifacts == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: qa-changes-pr-${{ inputs.pr_number != '' && inputs.pr_number || github.event.pull_request.number }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/qa-artifacts
        if-no-files-found: ignore
        retention-days: ${{ inputs.artifact_retention_days }}
