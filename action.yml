name: QA Changes
description: >-
  Validate a pull request by actually running the software — sets up the repo,
  exercises the changed behaviour, and posts a QA report as a PR comment.
author: khawjaahmad

inputs:
  api_key:
    description: API key for the LLM provider (store it as the LLM_API_KEY secret).
    required: true
  provider:
    description: >-
      Which OpenAI-compatible endpoint to use: zai (z.ai coding plan), openai,
      gemini, or custom. With `custom` you must also set `base_url` and `model`.
    required: false
    default: zai
  model:
    description: >-
      Model id. Defaults per provider — zai: glm-5.3, openai: gpt-5,
      gemini: gemini-2.5-pro.
    required: false
    default: ""
  base_url:
    description: >-
      Override the OpenAI-compatible base URL that `/chat/completions` is
      appended to. Required when provider is `custom`.
    required: false
    default: ""
  github_token:
    description: Token used to read the pull request and post the QA report.
    required: false
    default: ${{ github.token }}
  pr_number:
    description: Pull request number. Defaults to the PR from the triggering event.
    required: false
    default: ""
  github_api_url:
    description: >-
      GitHub REST API root. Defaults to the host the workflow is running on, so
      GitHub Enterprise Server works without any extra configuration.
    required: false
    default: ${{ github.api_url }}
  effort:
    description: >-
      Reasoning effort, sent as `reasoning_effort` and passed through verbatim.
      Each provider has its own levels — z.ai glm-5.3: low, high, max (default
      max); OpenAI: low, medium, high, xhigh. Leave empty to use the model's
      own default.
    required: false
    default: ""
  setup_command:
    description: Optional command the agent runs before it starts testing.
    required: false
    default: ""
  max_turns:
    description: Model turns before the agent is told to wrap up and report.
    required: false
    default: "40"
  time_budget:
    description: >-
      Wall-clock seconds before the agent is told to wrap up and report. Keep it
      comfortably under the job's `timeout-minutes`, or the job is killed before
      a report exists. Set to 0 to rely on `max_turns` alone.
    required: false
    default: "1500"
  command_timeout:
    description: Default timeout in seconds for each command the agent runs.
    required: false
    default: "300"
  request_timeout:
    description: Timeout in seconds for each request to the model endpoint.
    required: false
    default: "600"
  max_context_chars:
    description: >-
      Approximate size of the conversation, in characters, before the oldest
      command output is elided. Lower it for a model with a small context window.
    required: false
    default: "240000"
  post_comment:
    description: Post the report as a PR comment. Set to false to only log it.
    required: false
    default: "true"
  fail_on:
    description: >-
      Which verdicts fail the check: a list such as `FAIL` or `FAIL,PARTIAL`, or
      `none` to always stay green while you are trying the action out.
    required: false
    default: FAIL
  upload_artifacts:
    description: >-
      Upload whatever the agent saved (screenshots, logs) as a workflow artifact.
    required: false
    default: "true"
  artifact_retention_days:
    description: How long to keep the uploaded artifacts.
    required: false
    default: "14"
  python_version:
    description: Python version used to run the agent.
    required: false
    default: "3.11"

outputs:
  status:
    description: The QA verdict — PASS, FAIL or PARTIAL.
    value: ${{ steps.qa.outputs.status }}

runs:
  using: composite
  steps:
    - name: Set up Python for the QA agent
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Run QA agent
      id: qa
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PYTHONPATH: ${{ github.action_path }}
        QA_API_KEY: ${{ inputs.api_key }}
        QA_PROVIDER: ${{ inputs.provider }}
        QA_MODEL: ${{ inputs.model }}
        QA_BASE_URL: ${{ inputs.base_url }}
        QA_GITHUB_TOKEN: ${{ inputs.github_token }}
        QA_REPO: ${{ github.repository }}
        QA_GITHUB_API_URL: ${{ inputs.github_api_url }}
        QA_PR_NUMBER: ${{ inputs.pr_number != '' && inputs.pr_number || github.event.pull_request.number }}
        QA_WORKSPACE: ${{ github.workspace }}
        QA_EFFORT: ${{ inputs.effort }}
        QA_SETUP_COMMAND: ${{ inputs.setup_command }}
        QA_MAX_TURNS: ${{ inputs.max_turns }}
        QA_TIME_BUDGET: ${{ inputs.time_budget }}
        QA_COMMAND_TIMEOUT: ${{ inputs.command_timeout }}
        QA_REQUEST_TIMEOUT: ${{ inputs.request_timeout }}
        QA_MAX_CONTEXT_CHARS: ${{ inputs.max_context_chars }}
        QA_POST_COMMENT: ${{ inputs.post_comment }}
        QA_FAIL_ON: ${{ inputs.fail_on }}
        QA_ARTIFACTS_DIR: ${{ runner.temp }}/qa-artifacts
        QA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: python -m qa_agent

    # Screenshots and logs cannot be embedded in a PR comment, so they travel
    # with the run instead; the report lists them by name. `always()` because the
    # evidence matters most when the verdict was FAIL.
    - name: Upload QA artifacts
      if: always() && inputs.upload_artifacts == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: qa-changes-pr-${{ inputs.pr_number != '' && inputs.pr_number || github.event.pull_request.number }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/qa-artifacts
        if-no-files-found: ignore
        retention-days: ${{ inputs.artifact_retention_days }}
